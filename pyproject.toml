[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envlinter"
version = "0.1.0"
description = "Check that your .env files, docker-compose services and source code agree with each other."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "maybecooldev" }]
keywords = ["dotenv", "linter", "environment", "docker-compose", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
envlinter = "envlinter.cli:main"

[project.urls]
Homepage = "https://github.com/maybecooldev/envlinter"
Issues = "https://github.com/maybecooldev/envlinter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/envlinter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
